; Artefact textures to rework (make_textures.py). One section per texture, named as the models name it.
;   scale    how much bigger: 4 = x4 by the upscaler; 1 = same size, cleaned up only (the upscaler at x4, then back down)
;   bump     1 = make <name>_bump + <name>_bump# and turn the bump on (.thm/.ltx); only shaders that go through the
;            deferred model path read it (models\model, artefact, artefact2, weapons); selflight/xdistort*/lightplanes don't
;   strength normal map strength (how deep the relief reads)
;   gloss    specular in the bump's red channel, 0..1 (Anomaly's flat models use 2/255; vanilla bumps 0.01..0.05)
;   detail   radius (px of the result) of the height's high-pass: bigger keeps larger shapes in the relief
;   users    the artefacts that use it (for the record)
;
; Pilot, 2026-11-22: five artefacts (af_drops, af_gravi, af_electra_moonlight, af_dummy_glassbeads, af_black).

